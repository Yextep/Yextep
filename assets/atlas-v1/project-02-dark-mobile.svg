<svg xmlns="http://www.w3.org/2000/svg" width="800" height="355" viewBox="0 0 800 355" role="img" aria-labelledby="title desc">
<title id="title">TataBot — orquestación multimodal</title>
<desc id="desc">Asistente de Telegram que integra conversación, análisis de documentos e imágenes, generación y edición de imágenes, transcripción y voz.</desc>
<defs>
 <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#343b47"/></pattern>
 <linearGradient id="beam"><stop stop-color="#93b0ff" stop-opacity="0"/><stop offset=".5" stop-color="#93b0ff"/><stop offset="1" stop-color="#93b0ff" stop-opacity="0"/></linearGradient>
</defs>
<style>
 .drift {animation:float 12s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
 .flow {stroke-dasharray:3 16;animation:trace 18s linear infinite}
 .pulse {animation:breathe 5s ease-in-out infinite}
 @keyframes float {0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
 @keyframes trace {to{stroke-dashoffset:-228}}
 @keyframes breathe {0%,100%{opacity:.5}50%{opacity:1}}
 @media (prefers-reduced-motion:reduce){.drift,.flow,.pulse{animation:none}}
</style>
<rect x="1" y="1" width="798" height="353" rx="14" fill="#181d25" stroke="#343b47"/><rect x="1" y="25" width="4" height="305" rx="2" fill="#c1adf6"/><text x="34" y="48" fill="#c1adf6" font-family="Arial, sans-serif" font-size="23" font-weight="600">02</text><text x="84" y="48" fill="#a3abb9" font-family="Arial, sans-serif" font-size="18" font-weight="400" letter-spacing="1.2">ORQUESTACIÓN MULTIMODAL</text><text x="33" y="132" fill="#eef0f4" font-family="Arial, sans-serif" font-size="62" font-weight="600" letter-spacing="-2">TataBot</text><text x="36" y="181" fill="#a3abb9" font-family="Arial, sans-serif" font-size="23" font-weight="400">Texto, imágenes y voz en una misma conversación.</text><g transform="translate(430 219) scale(0.9)"><line x1="20" y1="30" x2="74" y2="14" stroke="#343b47" stroke-width="1.4" /><line x1="20" y1="30" x2="39" y2="104" stroke="#343b47" stroke-width="1.4" /><line x1="20" y1="30" x2="102" y2="77" stroke="#343b47" stroke-width="1.4" /><line x1="74" y1="14" x2="131" y2="31" stroke="#343b47" stroke-width="1.4" /><line x1="74" y1="14" x2="102" y2="77" stroke="#343b47" stroke-width="1.4" /><line x1="131" y1="31" x2="192" y2="20" stroke="#343b47" stroke-width="1.4" /><line x1="131" y1="31" x2="102" y2="77" stroke="#343b47" stroke-width="1.4" /><line x1="131" y1="31" x2="165" y2="103" stroke="#343b47" stroke-width="1.4" /><line x1="192" y1="20" x2="226" y2="76" stroke="#343b47" stroke-width="1.4" /><line x1="39" y1="104" x2="102" y2="77" stroke="#343b47" stroke-width="1.4" /><line x1="102" y1="77" x2="165" y2="103" stroke="#343b47" stroke-width="1.4" /><line x1="102" y1="77" x2="226" y2="76" stroke="#343b47" stroke-width="1.4" /><line x1="165" y1="103" x2="226" y2="76" stroke="#343b47" stroke-width="1.4" /><circle cx="20" cy="30" r="6" fill="#181d25" stroke="#c1adf6" stroke-width="1.5"/><circle cx="74" cy="14" r="6" fill="#181d25" stroke="#c1adf6" stroke-width="1.5"/><circle cx="131" cy="31" r="6" fill="#181d25" stroke="#c1adf6" stroke-width="1.5"/><circle cx="192" cy="20" r="6" fill="#181d25" stroke="#c1adf6" stroke-width="1.5"/><circle cx="39" cy="104" r="6" fill="#181d25" stroke="#c1adf6" stroke-width="1.5"/><circle cx="102" cy="77" r="13" fill="#181d25" stroke="#c1adf6" stroke-width="1.5"/><circle cx="165" cy="103" r="6" fill="#181d25" stroke="#c1adf6" stroke-width="1.5"/><circle cx="226" cy="76" r="6" fill="#181d25" stroke="#c1adf6" stroke-width="1.5"/><circle class="pulse" cx="102" cy="77" r="6" fill="#c1adf6"/></g><text x="36" y="231" fill="#c1adf6" font-family="Arial, sans-serif" font-size="16" font-weight="500" letter-spacing="1">ASYNCIO</text><text x="36" y="265" fill="#c1adf6" font-family="Arial, sans-serif" font-size="16" font-weight="500" letter-spacing="1">OPENAI</text><text x="36" y="299" fill="#c1adf6" font-family="Arial, sans-serif" font-size="16" font-weight="500" letter-spacing="1">TELEGRAM</text>
