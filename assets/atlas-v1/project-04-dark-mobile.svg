<svg xmlns="http://www.w3.org/2000/svg" width="800" height="355" viewBox="0 0 800 355" role="img" aria-labelledby="title desc">
<title id="title">CSV-PDF — compatibilidad de formatos</title>
<desc id="desc">Conversor recursivo de hojas Excel/Calc a CSV y documentos Word/Writer a PDF, con motores alternativos y un reporte de cada ejecución.</desc>
<defs>
 <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#343b47"/></pattern>
 <linearGradient id="beam"><stop stop-color="#93b0ff" stop-opacity="0"/><stop offset=".5" stop-color="#93b0ff"/><stop offset="1" stop-color="#93b0ff" stop-opacity="0"/></linearGradient>
</defs>
<style>
 .drift {animation:float 12s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
 .flow {stroke-dasharray:3 16;animation:trace 18s linear infinite}
 .pulse {animation:breathe 5s ease-in-out infinite}
 @keyframes float {0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
 @keyframes trace {to{stroke-dashoffset:-228}}
 @keyframes breathe {0%,100%{opacity:.5}50%{opacity:1}}
 @media (prefers-reduced-motion:reduce){.drift,.flow,.pulse{animation:none}}
</style>
<rect x="1" y="1" width="798" height="353" rx="14" fill="#181d25" stroke="#343b47"/><rect x="1" y="25" width="4" height="305" rx="2" fill="#95bafa"/><text x="34" y="48" fill="#95bafa" font-family="Arial, sans-serif" font-size="23" font-weight="600">04</text><text x="84" y="48" fill="#a3abb9" font-family="Arial, sans-serif" font-size="18" font-weight="400" letter-spacing="1.2">COMPATIBILIDAD DE FORMATOS</text><text x="33" y="132" fill="#eef0f4" font-family="Arial, sans-serif" font-size="62" font-weight="600" letter-spacing="-2">CSV-PDF</text><text x="36" y="181" fill="#a3abb9" font-family="Arial, sans-serif" font-size="23" font-weight="400">Muchas entradas. Salidas que se pueden revisar.</text><g transform="translate(430 219) scale(0.9)"><rect x="16" y="18" width="55" height="69" rx="5" fill="#181d25" stroke="#95bafa"/><rect x="34" y="32" width="55" height="69" rx="5" fill="#181d25" stroke="#95bafa"/><rect x="52" y="46" width="55" height="69" rx="5" fill="#181d25" stroke="#95bafa"/><line x1="102" y1="73" x2="143" y2="73" stroke="#95bafa" stroke-width="2" /><path d="M136 67 L143 73 L136 79" fill="none" stroke="#95bafa" stroke-width="2"/><rect x="158" y="28" width="68" height="38" rx="5" fill="#95bafa" opacity=".16"/><rect x="158" y="81" width="68" height="38" rx="5" fill="#95bafa" opacity=".16"/><text x="192" y="54" fill="#95bafa" font-family="Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle">CSV</text><text x="192" y="107" fill="#95bafa" font-family="Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle">PDF</text></g><text x="36" y="231" fill="#95bafa" font-family="Arial, sans-serif" font-size="16" font-weight="500" letter-spacing="1">PARSERS</text><text x="36" y="265" fill="#95bafa" font-family="Arial, sans-serif" font-size="16" font-weight="500" letter-spacing="1">LIBREOFFICE</text><text x="36" y="299" fill="#95bafa" font-family="Arial, sans-serif" font-size="16" font-weight="500" letter-spacing="1">REPORTES</text>
</svg>