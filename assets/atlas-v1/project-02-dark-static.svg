"/><circle cx="192" cy="20" r="6" fill="#181d25" stroke="#c1adf6" stroke-width="1.5"/><circle cx="39" cy="104" r="6" fill="#181d25" stroke="#c1adf6" stroke-width="1.5"/><circle cx="102" cy="77" r="13" fill="#181d25" stroke="#c1adf6" stroke-width="1.5"/><circle cx="165" cy="103" r="6" fill="#181d25" stroke="#c1adf6" stroke-width="1.5"/><circle cx="226" cy="76" r="6" fill="#181d25" stroke="#c1adf6" stroke-width="1.5"/><circle class="pulse" cx="102" cy="77" r="6" fill="#c1adf6"/></g><text x="38" y="191" fill="#c1adf6" font-family="Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.2">ASYNCIO / OPENAI / TELEGRAM</text><path d="M1141 43 L1158 26 M1143 26 H1158 V41" fill="none" stroke="#a3abb9" stroke-width="1.5"/>
