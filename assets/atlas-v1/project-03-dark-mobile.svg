ircle cx="192" cy="20" r="6" fill="#181d25" stroke="#eec08d" stroke-width="1.5"/><circle cx="39" cy="104" r="6" fill="#181d25" stroke="#eec08d" stroke-width="1.5"/><circle cx="102" cy="77" r="13" fill="#181d25" stroke="#eec08d" stroke-width="1.5"/><circle cx="165" cy="103" r="6" fill="#181d25" stroke="#eec08d" stroke-width="1.5"/><circle cx="226" cy="76" r="6" fill="#181d25" stroke="#eec08d" stroke-width="1.5"/><circle class="pulse" cx="102" cy="77" r="6" fill="#eec08d"/><path d="M20 30 L102 77 L226 76" fill="none" stroke="#eec08d" stroke-width="2" class="flow"/></g><text x="36" y="231" fill="#eec08d" font-family="Arial, sans-serif" font-size="16" font-weight="500" letter-spacing="1">TF-IDF</text><text x="36" y="265" fill="#eec08d" font-family="Arial, sans-serif" font-size="16" font-weight="500" letter-spacing="1">TEXTRANK</text><text x="36" y="299" fill="#eec08d" font-family="Arial, sans-serif" font-size="16" font-weight="500" letter-spacing="1">MMR</text>
